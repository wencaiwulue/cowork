<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2e2a25"/>
      <stop offset="1" stop-color="#1a1815"/>
    </linearGradient>
    <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e08a5c"/>
      <stop offset="1" stop-color="#cf7a54"/>
    </linearGradient>
  </defs>

  <!-- Outer rounded square (dark warm brown) -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>

  <!-- Inner panel (warm cream, slightly inset) -->
  <rect x="96" y="96" width="832" height="832" rx="176" fill="#f4f2ee" opacity="0.06"/>

  <!-- Left code bracket "<" in coral -->
  <path d="M 400 340 L 280 512 L 400 684"
        stroke="url(#coral)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Right code bracket ">" in coral -->
  <path d="M 624 340 L 744 512 L 624 684"
        stroke="url(#coral)" stroke-width="64" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Slash in center (terminal/code feel) -->
  <line x1="556" y1="340" x2="468" y2="684"
        stroke="url(#coral)" stroke-width="48" stroke-linecap="round" opacity="0.85"/>

  <!-- AI spark dot (upper right, cream) -->
  <circle cx="744" cy="300" r="36" fill="#f4f2ee"/>
  <circle cx="744" cy="300" r="18" fill="#cf7a54"/>
</svg>
